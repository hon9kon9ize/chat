name                 = "hkchat"
main                 = "worker/src/index.ts"
compatibility_date   = "2026-09-10"
compatibility_flags  = ["nodejs_compat"]

# Non-sensitive config — override per environment below if needed
[vars]
MAX_TOKENS    = "8192"
DAILY_LIMIT   = "50"
RATE_LIMIT_TZ = "Asia/Hong_Kong"

# Secrets — set once with:
#   wrangler secret put UPSTREAM_BASE_URL
#   wrangler secret put UPSTREAM_API_KEY
#   wrangler secret put MODEL_ID

# D1 Database binding for storing user input and response
[[d1_databases]]
binding       = "DB"
database_name = "hkchat-db"
database_id   = "b730264e-0ba1-4da0-9564-107ce9fd5c3b"


# Container definition
# `name` is pinned to the already-existing container application (created back
# when the class was still called HKChatContainer) so the Durable Object class
# rename below doesn't try to spin up a second container app on the same DO
# namespace (Cloudflare rejects that with DURABLE_OBJECT_ALREADY_HAS_APPLICATION).
[[containers]]
name          = "hkchat-hkchatcontainer"
class_name    = "CantoChatContainer"
image         = "./Dockerfile"
max_instances = 2

# Durable Object binding that manages container lifecycle
[[durable_objects.bindings]]
name       = "HKCHAT"
class_name = "CantoChatContainer"

[[migrations]]
tag                = "v1"
new_sqlite_classes = ["HKChatContainer"]

[[migrations]]
tag             = "v2"
renamed_classes = [{ from = "HKChatContainer", to = "CantoChatContainer" }]
