[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hkchat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "strands-agents>=1.55.0",
  "strands-agents-tools>=0.8.0",
  "openai>=3.13.0",
]

[project.scripts]
hkchat = "backend.main:app"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
